decided_by: "" # 决策人; human_decision_required = true 的门必填
role: "" # 决策时承担的角色; 角色/Agent 决策时填写
date: "" # 决策日期, 格式 YYYY-MM-DD
recycle_target: "" # decision = recycle 时必填, 打回的目标阶段
follow_up: [] # decision = recycle | hold 时必填, 解除状态的后续动作
notes: ""
